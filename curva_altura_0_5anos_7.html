<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Curva de Crescimento 0-5 anos (OMS)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
.page { background: white; width: 297mm; min-height: 210mm; margin: 0 auto; padding: 10mm 10mm 8mm 10mm; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.tab-bar { display: flex; gap: 0; margin-bottom: 10px; border-bottom: 3px solid #d63384; }
.tab-btn { padding: 8px 28px; font-size: 14px; font-weight: bold; border: none; cursor: pointer; background: #f0f0f0; color: #666; border-radius: 6px 6px 0 0; margin-right: 4px; }
.tab-btn.active-girl { background: #d63384; color: white; }
.tab-btn.active-boy  { background: #1565C0; color: white; }
.patient-panel { background: #f0f7ff; border: 1px solid #a8c8e8; border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.patient-panel label { font-size: 11px; color: #336; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 3px; }
.patient-panel input, .patient-panel select { border: 1px solid #99b; border-radius: 4px; padding: 5px 8px; font-size: 13px; }
.patient-panel button { background: #2a6099; color: white; border: none; border-radius: 4px; padding: 7px 13px; font-size: 13px; cursor: pointer; font-weight: bold; }
.btn-save { background: #1a7a1a !important; }
.btn-drive { background: #1a73e8 !important; }
.btn-del-pt { background: #992222 !important; }
.btn-clear2 { background: #888 !important; }
.drive-status { font-size: 11px; padding: 3px 10px; border-radius: 3px; border: 1px solid #ccc; background: #f8f8f8; color: #555; }
.drive-status.connected { background: #e8f5e9; border-color: #81c784; color: #2e7d32; }
.drive-status.error { background: #fdecea; border-color: #e57373; color: #c62828; }
.saved-badge { font-size:11px; color:#3a7a3a; background:#d8f0d8; border:1px solid #9ac89a; border-radius:3px; padding:2px 8px; display:none; }
.unsaved-badge { font-size:11px; color:#996600; background:#fff5cc; border:1px solid #ddaa44; border-radius:3px; padding:2px 8px; display:none; }
.search-wrap { position: relative; }
#searchSuggestions { display: none; position: absolute; top: 100%; left: 0; z-index: 999; background: white; border: 1px solid #99b; border-radius: 0 0 4px 4px; min-width: 200px; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
#searchSuggestions li { list-style: none; padding: 7px 12px; cursor: pointer; font-size: 13px; }
#searchSuggestions li:hover { background: #e8f0ff; }
.form-panel { background: #f7f0f7; border: 1px solid #d8a8d8; border-radius: 6px; padding: 10px 14px 8px; margin-bottom: 10px; }
.form-row { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.form-row + .form-row { padding-top: 6px; border-top: 1px dashed #d0b0d0; }
.form-group { display: flex; flex-direction: column; }
.form-panel label { font-size: 11px; color: #555; margin-bottom: 3px; font-weight: bold; text-transform: uppercase; }
.form-panel input { border: 1px solid #bbb; border-radius: 4px; padding: 5px 8px; font-size: 13px; }
.form-panel button { background: #d63384; color: white; border: none; border-radius: 4px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-weight: bold; align-self: flex-end; }
.form-panel button:hover { background: #b5206e; }
#error-msg { font-size: 12px; color: #c0392b; min-height: 16px; margin-top: 4px; }
.chart-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
.chart-title { font-size: 22px; color: #c060c0; font-weight: bold; letter-spacing: 1px; }
.chart-subtitle { font-size: 13px; color: #333; margin-top: 2px; }
.chart-wrapper { position: relative; width: 100%; }
canvas#whoChart { display: block; width: 100% !important; }
.footer-ref { font-size: 10px; color: #666; text-align: right; margin-top: 4px; }
.points-list { margin-top: 10px; }
.points-list table { width: 100%; border-collapse: collapse; font-size: 11px; }
.points-list th { background: #e0a0e0; padding: 3px 8px; text-align: left; border: 1px solid #ccc; }
.points-list td { padding: 3px 8px; border: 1px solid #ddd; }
.dot-prev { width:10px; height:10px; border-radius:50%; display:inline-block; vertical-align:middle; margin-right:4px; border:1.5px solid white; outline:1px solid rgba(0,0,0,0.3); }
.btn-del { background:none; border:none; cursor:pointer; color:#999; font-size:14px; padding:0 2px; }
.btn-del:hover { color: #c0392b; }
.vel-section { margin-top:10px; background:#f0f7ff; border:1px solid #a8c8e8; border-radius:5px; padding:8px 14px; }
.vel-title { font-size:11px; font-weight:bold; text-transform:uppercase; color:#336; margin-bottom:4px; }
.vel-grid { display:flex; gap:20px; flex-wrap:wrap; }
.vel-item { display:flex; flex-direction:column; gap:2px; }
.vel-label { font-size:10px; color:#557; }
.vel-value { font-size:14px; font-weight:bold; color:#1a3a6a; }
.vel-sub { font-size:10px; color:#779; }
.target-info { font-size:12px; color:#7b2d8b; margin-top:4px; }
@media print {
  body { background: white; padding: 0; }
  .page { box-shadow: none; width: 100%; padding: 8mm; }
  .form-panel, .patient-panel, .tab-bar { display: none; }
  .btn-del { display: none; }
}
</style>
</head>
<body>
<div class="page">

  <div class="tab-bar" id="tabBar">
    <button class="tab-btn active-girl" id="tabGirl" onclick="switchSex('girl')">&#9792; Meninas</button>
    <button class="tab-btn" id="tabBoy"  onclick="switchSex('boy')">&#9794; Meninos</button>
  </div>

  <div class="patient-panel">
    <div class="form-group">
      <label>Buscar paciente</label>
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Nome ou ID..." style="width:190px"
               oninput="onSearchInput()" onkeydown="if(event.key==='Enter')searchPatient()">
        <ul id="searchSuggestions"></ul>
      </div>
    </div>
    <button onclick="searchPatient()">&#128269; Carregar</button>
    <button onclick="newPatient()">&#65291; Nova</button>
    <button class="btn-save" onclick="savePatient()">&#128190; Salvar</button>
    <button class="btn-del-pt" onclick="deletePatient()">&#128465; Apagar</button>
    <div style="flex:1"></div>
    <button class="btn-drive" onclick="driveSignIn()" id="btnDriveLogin">Drive</button>
    <span class="drive-status" id="driveStatus">nao conectado</span>
    <button onclick="exportData()" style="background:#5a7a2a;color:white;border:none;border-radius:4px;padding:7px 10px;font-size:12px;cursor:pointer;">&#8595; Backup</button>
    <button onclick="document.getElementById('importFile').click()" style="background:#7a4a2a;color:white;border:none;border-radius:4px;padding:7px 10px;font-size:12px;cursor:pointer;">&#8593; Restaurar</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <span class="saved-badge" id="savedBadge">&#10003; Salvo</span>
    <span class="unsaved-badge" id="unsavedBadge">&#9679; nao salvo</span>
  </div>

  <div class="form-panel">
    <div class="form-row">
      <div class="form-group">
        <label>Data da consulta</label>
        <input type="date" id="refdate" style="width:145px;background:#fffbe6;border-color:#c9a800">
      </div>
      <span style="font-size:11px;color:#888;align-self:flex-end;padding-bottom:6px;">Ajuste se necessario</span>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Data de nascimento</label>
        <input type="date" id="dob" style="width:145px">
      </div>
      <div class="form-group">
        <label>Paciente / ID</label>
        <input type="text" id="lbl" placeholder="Nome ou codigo" style="width:150px">
      </div>
      <div class="form-group">
        <label>Comprimento/Altura (cm)</label>
        <input type="number" id="ht" min="30" max="130" step="0.1" placeholder="ex: 75.5" style="width:120px">
      </div>
      <button onclick="addPoint()">+ Marcar</button>
      <button class="btn-clear2" onclick="clearAll()" style="background:#888;color:white;border:none;border-radius:4px;padding:7px 12px;font-size:13px;cursor:pointer;">Limpar</button>
    </div>
    <div class="form-row" style="border-top:1px dashed #d0b0d0;padding-top:6px;">
      <div class="form-group">
        <label>Estatura pai (cm)</label>
        <input type="number" id="fatherHt" min="100" max="220" step="0.1" placeholder="ex: 175" style="width:110px" oninput="calcTargetHeight()">
      </div>
      <div class="form-group">
        <label>Estatura mae (cm)</label>
        <input type="number" id="motherHt" min="100" max="220" step="0.1" placeholder="ex: 162" style="width:110px" oninput="calcTargetHeight()">
      </div>
      <div class="form-group">
        <label>Altura alvo (cm)</label>
        <input type="number" id="targetHt" min="100" max="220" step="0.1" placeholder="calculado ou manual" style="width:140px" oninput="applyTarget()">
      </div>
      <button onclick="applyTarget()" style="background:#7b2d8b">&#127919; Mostrar alvo</button>
      <button onclick="clearTarget()" style="background:#888;color:white;border:none;border-radius:4px;padding:7px 12px;font-size:13px;cursor:pointer;">X Remover</button>
      <span id="targetInfo" class="target-info"></span>
    </div>
    <div id="error-msg"></div>
  </div>

  <div class="chart-header">
    <div>
      <div class="chart-title" id="chartTitle">Length/Height-for-age GIRLS</div>
      <div class="chart-subtitle">Birth to 5 years (z-scores)</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <svg width="44" height="44" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="48" fill="none" stroke="#00529b" stroke-width="4"/>
        <ellipse cx="50" cy="50" rx="48" ry="22" fill="none" stroke="#00529b" stroke-width="2.5"/>
        <ellipse cx="50" cy="50" rx="20" ry="48" fill="none" stroke="#00529b" stroke-width="2.5"/>
        <line x1="2" y1="50" x2="98" y2="50" stroke="#00529b" stroke-width="2.5"/>
        <rect x="44" y="10" width="12" height="30" rx="2" fill="#00529b"/>
        <rect x="38" y="22" width="24" height="8" rx="2" fill="#00529b"/>
      </svg>
      <div style="text-align:right;font-size:11px;line-height:1.3;color:#333;"><strong>World Health</strong><br>Organization</div>
    </div>
  </div>

  <div class="chart-wrapper">
    <canvas id="whoChart"></canvas>
  </div>
  <div class="footer-ref">WHO Child Growth Standards</div>

  <div class="points-list" id="ptsList" style="display:none">
    <table>
      <thead>
        <tr>
          <th>Paciente</th><th>Data consulta</th><th>Data nasc.</th>
          <th>Idade</th><th>Comprimento/Altura</th>
          <th>Z-score</th><th>Velocidade</th>
          <th class="no-print"></th>
        </tr>
      </thead>
      <tbody id="ptsTbody"></tbody>
    </table>
  </div>

  <div class="vel-section" id="velSection" style="display:none">
    <div class="vel-title">Velocidade de Crescimento</div>
    <div class="vel-grid" id="velGrid"></div>
  </div>

</div>

// Z-score da altura alvo aos 19 anos (tabela OMS 5-19a, mes 228)
const REF19 = {
  girl: {p3:182.8, p2:176.2, p1:169.7, z0:163.2, m1:156.6, m2:150.2, m3:143.5},
  boy:  {p3:198.4, p2:191.1, p1:183.8, z0:176.5, m1:169.2, m2:161.9, m3:154.6}
};

let _sex = 'girl';
let _targetZ = null; // z-score do alvo (calculado sobre tabela 19a)
let _targetHtCm = null;

function rawFor(sex) { return sex === 'girl' ? GIRLS : BOYS; }

// Calcula z-score a partir da tabela de referencia dos 19 anos
function zFrom19(ht, sex) {
  var r = REF19[sex];
  if (ht >= r.z0) {
    if (ht <= r.p1) return (ht - r.z0) / (r.p1 - r.z0);
    if (ht <= r.p2) return 1 + (ht - r.p1) / (r.p2 - r.p1);
    if (ht <= r.p3) return 2 + (ht - r.p2) / (r.p3 - r.p2);
    return 3 + (ht - r.p3) / (r.p3 - r.p2);
  } else {
    if (ht >= r.m1) return -(r.z0 - ht) / (r.z0 - r.m1);
    if (ht >= r.m2) return -1 - (r.m1 - ht) / (r.m1 - r.m2);
    if (ht >= r.m3) return -2 - (r.m2 - ht) / (r.m2 - r.m3);
    return -3 - (r.m3 - ht) / (r.m2 - r.m3);
  }
}

// Converte z-score para altura numa linha da tabela 0-5
function htFromZ(z, row) {
  var p3=row[1],p2=row[2],p1=row[3],z0=row[4],m1=row[5],m2=row[6],m3=row[7];
  if (z >= 0) {
    if (z <= 1) return z0 + z*(p1-z0);
    if (z <= 2) return p1 + (z-1)*(p2-p1);
    if (z <= 3) return p2 + (z-2)*(p3-p2);
    return p3 + (z-3)*(p3-p2);
  } else {
    if (z >= -1) return z0 + z*(z0-m1);
    if (z >= -2) return m1 + (z+1)*(m1-m2);
    if (z >= -3) return m2 + (z+2)*(m2-m3);
    return m3 + (z+3)*(m2-m3);
  }
}

// Calcula z-score na tabela 0-5
function calcZ05(ageM, ht) {
  var raw = rawFor(_sex);
  var row = raw.find(function(r){return r[0]===ageM;});
  if (!row) {
    var lo = null, hi = null;
    for (var i=0; i<raw.length; i++) {
      if (raw[i][0] < ageM) lo = raw[i];
      if (raw[i][0] > ageM && !hi) hi = raw[i];
    }
    if (!lo || !hi) return null;
    var f = (ageM - lo[0]) / (hi[0] - lo[0]);
    row = [ageM,
      lo[1]+f*(hi[1]-lo[1]), lo[2]+f*(hi[2]-lo[2]), lo[3]+f*(hi[3]-lo[3]),
      lo[4]+f*(hi[4]-lo[4]), lo[5]+f*(hi[5]-lo[5]), lo[6]+f*(hi[6]-lo[6]),
      lo[7]+f*(hi[7]-lo[7])
    ];
  }
  var p3=row[1],p2=row[2],p1=row[3],z0=row[4],m1=row[5],m2=row[6],m3=row[7];
  var z;
  if (ht >= z0) {
    if (ht <= p1) z = (ht-z0)/(p1-z0);
    else if (ht <= p2) z = 1+(ht-p1)/(p2-p1);
    else if (ht <= p3) z = 2+(ht-p2)/(p3-p2);
    else z = 3+(ht-p3)/(p3-p2);
  } else {
    if (ht >= m1) z = -(z0-ht)/(z0-m1);
    else if (ht >= m2) z = -1-(m1-ht)/(m1-m2);
    else if (ht >= m3) z = -2-(m2-ht)/(m2-m3);
    else z = -3-(m3-ht)/(m2-m3);
  }
  return z.toFixed(2);
}

var pluginZLabels = {

var pluginYearLabels = {
  id: 'pluginYearLabels',
  afterDraw: function(chart) {
    var ctx = chart.ctx;
    var xAxis = chart.scales.x;
    var yAxis = chart.scales.y;
    var bottom = yAxis.bottom;
    ctx.save();
    ctx.font = 'bold 9px Arial'; ctx.fillStyle = '#222';

      var xPos = xAxis.getPixelForValue(yr*12);
      ctx.fillText(String(yr), xPos, bottom+16);
    });
    ctx.restore();
  }
};

var pluginTargetBand = {
  id: 'pluginTargetBand',
  afterDraw: function(chart) {
    if (_targetZ === null) return;
    var ctx = chart.ctx;
    var xAxis = chart.scales.x;
    var yAxis = chart.scales.y;
    var raw = rawFor(_sex);
    // delta em z-score equivalente a 5cm na referencia dos 19 anos
    var r19 = REF19[_sex];
    var sd = ((r19.p1 - r19.z0) + (r19.z0 - r19.m1)) / 2;
    var dz = 5 / sd;
    var zMid = _targetZ;
    var zTop = _targetZ + dz;
    var zBot = _targetZ - dz;

    function curvePixels(z) {
      return raw.map(function(row) {
        return {
          x: xAxis.getPixelForValue(row[0]),
          y: yAxis.getPixelForValue(htFromZ(z, row))
        };
      });
    }

    var pMid = curvePixels(zMid);
    var pTop = curvePixels(zTop);
    var pBot = curvePixels(zBot);

    // clip
    ctx.save();
    ctx.beginPath();
    ctx.rect(xAxis.left, yAxis.top, xAxis.right-xAxis.left, yAxis.bottom-yAxis.top);
    ctx.clip();

    // preenchimento
    ctx.beginPath();
    pTop.forEach(function(p,i){ i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y); });
    for(var i=pBot.length-1; i>=0; i--) ctx.lineTo(pBot[i].x, pBot[i].y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(123,45,139,0.09)';
    ctx.fill();

    // hachura
    ctx.save();
    ctx.beginPath();
    pTop.forEach(function(p,i){ i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y); });
    for(var j=pBot.length-1; j>=0; j--) ctx.lineTo(pBot[j].x, pBot[j].y);
    ctx.closePath(); ctx.clip();
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(123,45,139,0.2)'; ctx.lineWidth = 0.8;
    var xL=xAxis.left, xR=xAxis.right, yT=yAxis.top, yB=yAxis.bottom;
    for(var s=-(xR-xL+yB-yT); s<(xR-xL+yB-yT)*2; s+=7) {
      ctx.moveTo(xL+s, yT); ctx.lineTo(xL+s+(yB-yT), yB);
    }
    ctx.stroke();
    ctx.restore();

    // bordas
    ctx.beginPath(); ctx.strokeStyle='rgba(123,45,139,0.4)'; ctx.lineWidth=1;
    pTop.forEach(function(p,i){ i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
    ctx.stroke();
    ctx.beginPath();
    pBot.forEach(function(p,i){ i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
    ctx.stroke();

    // linha central tracejada
    ctx.beginPath(); ctx.strokeStyle='rgba(123,45,139,0.85)'; ctx.lineWidth=1.8;
    ctx.setLineDash([6,4]);
    pMid.forEach(function(p,i){ i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); });
    ctx.stroke(); ctx.setLineDash([]);

    ctx.restore();

    // labels lado direito
    var lx = xAxis.right+3;
    ctx.save();
    ctx.font='bold 10px Arial'; ctx.fillStyle='rgba(123,45,139,0.9)';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    var lTop=pTop[pTop.length-1], lMid=pMid[pMid.length-1], lBot=pBot[pBot.length-1];
    ctx.fillText('Z'+(zTop>=0?'+':'')+zTop.toFixed(1), lx, lTop.y);
    ctx.fillText('Z'+(zMid>=0?'+':'')+zMid.toFixed(1)+' (alvo)', lx, lMid.y);
    ctx.fillText('Z'+(zBot>=0?'+':'')+zBot.toFixed(1), lx, lBot.y);
    ctx.font='9px Arial'; ctx.fillStyle='rgba(123,45,139,0.7)';
    ctx.fillText(_targetHtCm+'cm', pMid[0].x+4, pMid[0].y-9);
    ctx.restore();
  }
};

// ══ CHART ══
function makeDatasets(raw) {
  function mk(col, label, color, lw) {
    return {
      label: label,
      data: raw.map(function(r){ return {x:r[0], y:r[col]}; }),
      borderColor: color, borderWidth: lw,
      pointRadius: 0, showLine: true, tension: 0.4, fill: false, type: 'scatter'
    };
  }
  // OMS 0-5 anos: apenas Z+3, Z+2, Z0, Z-2, Z-3 (sem Z+1 e Z-1)
  return [
    mk(1,'Z+3','#1a1a1a',2),
    mk(2,'Z+2','#cc2200',1.8),
    mk(4,'Z 0','#2e8b00',2.2),
    mk(6,'Z-2','#cc2200',1.8),
    mk(7,'Z-3','#1a1a1a',2)
  ];
}

// ══ ALTURA ALVO ══
function calcTargetHeight() {
  var f = parseFloat(document.getElementById('fatherHt').value);
  var m = parseFloat(document.getElementById('motherHt').value);
  if (!isNaN(f) && !isNaN(m)) {
    var offset = (_sex === 'boy') ? 6.5 : -6.5;
    var target = ((f + m) / 2) + offset;
    document.getElementById('targetHt').value = target.toFixed(1);
    applyTarget();
  }
}

function applyTarget() {
  var v = parseFloat(document.getElementById('targetHt').value);
  if (isNaN(v) || v < 100 || v > 220) { _targetZ = null; chart.update(); return; }
  _targetHtCm = v.toFixed(1);
  _targetZ = zFrom19(v, _sex);
  var info = document.getElementById('targetInfo');
  var sign = _targetZ >= 0 ? '+' : '';
  info.textContent = 'Z-score alvo (19a): ' + sign + _targetZ.toFixed(2);
  chart.update();
}

function clearTarget() {
  _targetZ = null; _targetHtCm = null;
  document.getElementById('targetHt').value = '';
  document.getElementById('fatherHt').value = '';
  document.getElementById('motherHt').value = '';
  document.getElementById('targetInfo').textContent = '';
  chart.update();
}

function switchSex(sex) {

// ══ PONTOS ══
var COLORS = ['#1565C0','#6A1B9A','#00695C','#BF360C','#AD1457','#37474F','#4527A0'];
var patients = {}, patOrder = [], points = [], cIdx = 0;

function getColor(key) {
  if (!patients[key]) { patients[key] = {color: COLORS[patOrder.length % COLORS.length]}; patOrder.push(key); }
  return patients[key].color;
}

function parseLocal(str) {
  var p = str.split('-').map(Number); return {year:p[0], month:p[1], day:p[2]};
}
function calcAgeMonths(dobStr, refStr) {
  var ref = refStr ? parseLocal(refStr) : (function(){ var n=new Date(); return {year:n.getFullYear(),month:n.getMonth()+1,day:n.getDate()}; })();
  var dob = parseLocal(dobStr);
  var m = (ref.year-dob.year)*12 + (ref.month-dob.month);
  if (ref.day < dob.day) m--;
  return m;
}
function fmtDate(s) { var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

function addPoint() {
  var refV = document.getElementById('refdate').value;
  var dobV = document.getElementById('dob').value;
  var htV  = parseFloat(document.getElementById('ht').value);
  var lblV = document.getElementById('lbl').value.trim() || 'Paciente';
  var err  = document.getElementById('error-msg');
  err.textContent = '';
  if (!refV) { err.textContent = 'Informe a data da consulta.'; return; }
  if (!dobV) { err.textContent = 'Informe a data de nascimento.'; return; }
  if (isNaN(htV)||htV<30||htV>130) { err.textContent = 'Comprimento invalido (30-130 cm).'; return; }
  var ageM = calcAgeMonths(dobV, refV);
  if (ageM < 0 || ageM > 60) { err.textContent = 'Idade fora do intervalo 0-5 anos ('+( ageM/12).toFixed(1)+'a).'; return; }
  var color = getColor(lblV);
  var z = calcZ05(ageM, htV);
  var pt = {id: Date.now(), label: lblV, dob: dobV, ref: refV, ageM: ageM, ht: htV, color: color, z: z};
  points.push(pt);
  rebuildDs(); renderTable(); markUnsaved();
  document.getElementById('ht').value = '';
  document.getElementById('ht').focus();
}

function rebuildDs() {
  chart.data.datasets.splice(5);
  var byP = {};
  points.forEach(function(p){ if(!byP[p.label])byP[p.label]=[]; byP[p.label].push(p); });
  patOrder.forEach(function(key) {
    if (!byP[key]) return;
    var pts = byP[key].slice().sort(function(a,b){return a.ageM-b.ageM;});
    var col = patients[key].color;
    chart.data.datasets.push({
      label: key, _pt: true, _name: key,
      data: pts.map(function(p){return{x:p.ageM, y:p.ht};}),
      borderColor: col, borderWidth: pts.length>1?1.5:0, borderDash: [4,3],
      pointBackgroundColor: col, pointBorderColor: 'white', pointBorderWidth: 2,
      pointRadius: 7, pointHoverRadius: 9, pointStyle: 'circle',
      showLine: true, tension: 0, fill: false, type: 'scatter'
    });
  });
  chart.update();
}

function removePoint(id) {
  var idx = points.findIndex(function(p){return p.id===id;});
  if (idx===-1) return;
  var rem = points[idx]; points.splice(idx,1);
  if (!points.find(function(p){return p.label===rem.label;})) {
    delete patients[rem.label];
    patOrder = patOrder.filter(function(k){return k!==rem.label;});
  }
  rebuildDs(); renderTable(); markUnsaved();
}
function clearAll() {
  points=[]; patients={}; patOrder=[]; cIdx=0;
  chart.data.datasets.splice(5); chart.update(); renderTable(); markUnsaved();
}

// ══ VELOCIDADE ══
function calcVel(p1, p2) {
  var d1=new Date(p1.ref), d2=new Date(p2.ref);
  var days=(d2-d1)/(864e5); if(days<=0)return null;
  return (p2.ht-p1.ht)/days*365.25;
}
function nearPeriod(pts, last, months) {
  var tgt = new Date(last.ref).getTime() - months*30.4375*864e5;
  var best=null, bd=Infinity;
  pts.forEach(function(p){
    if(p.id===last.id)return;
    var d=Math.abs(new Date(p.ref).getTime()-tgt);
    if(d<bd){bd=d;best=p;}
  });
  return (best && bd < 3*30.44*864e5) ? best : null;
}

function renderTable() {
  var sec=document.getElementById('ptsList'), tbody=document.getElementById('ptsTbody');
  tbody.innerHTML='';
  if(!points.length){sec.style.display='none'; renderVel([]); return;}
  sec.style.display='';
  var byP={};
  points.forEach(function(p){if(!byP[p.label])byP[p.label]=[]; byP[p.label].push(p);});
  var allPts = patOrder[0] && byP[patOrder[0]]
    ? byP[patOrder[0]].slice().sort(function(a,b){return new Date(a.ref)-new Date(b.ref);})
    : [];
  patOrder.forEach(function(key){
    if(!byP[key])return;
    var pts=byP[key].slice().sort(function(a,b){return new Date(a.ref)-new Date(b.ref);});
    pts.forEach(function(p,i){
      var yr=Math.floor(p.ageM/12), mo=p.ageM%12;
      var velStr='—';
      if(i>0){var v=calcVel(pts[i-1],p); if(v!==null)velStr=v.toFixed(1)+' cm/ano';}
      var tr=document.createElement('tr');
      var dot = i===0 ? '<span class="dot-prev" style="background:'+p.color+'"></span><strong>'+p.label+'</strong>' : '';
      tr.innerHTML =
        '<td>'+dot+'</td>'+
        '<td>'+fmtDate(p.ref)+'</td><td>'+fmtDate(p.dob)+'</td>'+
        '<td>'+yr+'a '+mo+'m</td><td>'+p.ht.toFixed(1)+' cm</td>'+
        '<td>'+(p.z||'—')+'</td><td>'+velStr+'</td>'+
        '<td><button class="btn-del" onclick="removePoint('+p.id+')">&#10007;</button></td>';
      tbody.appendChild(tr);
    });
  });
  renderVel(allPts);
}

function renderVel(pts) {
  var sec=document.getElementById('velSection'), grid=document.getElementById('velGrid');
  if(!pts||pts.length<2){sec.style.display='none';return;}
  sec.style.display=''; grid.innerHTML='';
  var last=pts[pts.length-1];
  function card(lbl, sub, p1, p2) {
    if(!p1||!p2)return'';
    var v=calcVel(p1,p2); if(v===null)return'';
    var dc=(p2.ht-p1.ht).toFixed(1);
    return '<div class="vel-item"><span class="vel-label">'+lbl+'</span>'+
      '<span class="vel-value">'+v.toFixed(1)+' cm/ano</span>'+
      '<span class="vel-sub">'+sub+' &bull; &Delta; '+(dc>0?'+':'')+dc+' cm</span></div>';
  }
  var html='';
  if(pts.length>=2) html+=card('Ultimas 2 medicoes', fmtDate(pts[pts.length-2].ref)+' -> '+fmtDate(last.ref), pts[pts.length-2], last);
  var n12=nearPeriod(pts,last,12); if(n12) html+=card('Ultimos ~12 meses', fmtDate(n12.ref)+' -> '+fmtDate(last.ref), n12, last);
  var n6=nearPeriod(pts,last,6); if(n6&&n6!==n12) html+=card('Ultimos ~6 meses', fmtDate(n6.ref)+' -> '+fmtDate(last.ref), n6, last);
  if(!html){sec.style.display='none';return;}
  grid.innerHTML=html;
}

var CLIENT_ID='182415914086-fmpb9lsdb0gicdhg6s1igf9ooancn960.apps.googleusercontent.com';
var SCOPES='https://www.googleapis.com/auth/drive.file';
var DB_FILE='curva_0_5_db.json';
var DB_FILE_519='curva_meninas_db.json';
var DB_KEY='curva05_db';
var _curKey=null, _unsaved=false, _token=null, _fileId=null, _db={}, _fileId519=null;

function loadDB(){try{return JSON.parse(localStorage.getItem(DB_KEY)||'{}');}catch(e){return{};}}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function activeDB(){return _token?_db:loadDB();}
function markUnsaved(){_unsaved=true;var u=document.getElementById('unsavedBadge');if(u)u.style.display=_curKey?'inline':'none';}
function flashSaved(){_unsaved=false;var s=document.getElementById('savedBadge'),u=document.getElementById('unsavedBadge');if(u)u.style.display='none';if(s){s.style.display='inline';clearTimeout(s._t);s._t=setTimeout(function(){s.style.display='none';},2500);}}
function setStatus(msg,cls){var el=document.getElementById('driveStatus');if(!el)return;el.textContent=msg;el.className='drive-status '+(cls||'');}

var _tc=null;
function initDrive(){
  if(typeof google==='undefined'){setTimeout(initDrive,500);return;}
  _tc=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:SCOPES,
    callback: function(resp){
      if(resp.error){setStatus('nao conectado','error');document.getElementById('btnDriveLogin').disabled=false;return;}
      _token=resp.access_token;
      document.getElementById('btnDriveLogin').textContent='Drive OK';
      document.getElementById('btnDriveLogin').disabled=true;
      setStatus('carregando...','');
      driveLoad();
    }
  });
  _tc.requestAccessToken({prompt:''});
}
function driveSignIn(){if(!_tc){alert('API carregando...');return;}_tc.requestAccessToken({prompt:'select_account'});}

async function dFetch(url,opts){
  opts=opts||{}; opts.headers=opts.headers||{}; opts.headers['Authorization']='Bearer '+_token;
  var r=await fetch(url,opts);
  if(r.status===401){_token=null;setStatus('sessao expirada','error');return null;}
  return r;
}
async function driveLoad(){
  try{
    var q=encodeURIComponent("name='"+DB_FILE+"' and trashed=false");
    var list=await dFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)&orderBy=modifiedTime desc');
    if(!list)return;
    var data=await list.json();
    if(data.files&&data.files.length>0){
      _fileId=data.files[0].id;
      var dl=await dFetch('https://www.googleapis.com/drive/v3/files/'+_fileId+'?alt=media');
      if(!dl)return;
      try{_db=JSON.parse(await dl.text());}catch(e){_db={};}
    } else {_db={};}
    saveDB(_db);
    var n=Object.keys(_db).length;
    setStatus(n+' paciente'+(n!==1?'s':'')+' no Drive','connected');
  }catch(e){setStatus('erro ao carregar','error');}
}
async function driveSave(db){
  var body=JSON.stringify(db,null,2);
  try{
    var r;
    if(_fileId){
      r=await dFetch('https://www.googleapis.com/upload/drive/v3/files/'+_fileId+'?uploadType=media',
        {method:'PATCH',headers:{'Content-Type':'application/json'},body:body});
    } else {
      var meta=JSON.stringify({name:DB_FILE,mimeType:'application/json'});
      var bd='bnd05'; var mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--';
      r=await dFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
        {method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp});
      if(r&&r.ok){var d=await r.json();_fileId=d.id;}
      var n=Object.keys(db).length; setStatus(n+' paciente'+(n!==1?'s':'')+' no Drive','connected'); return true;
    }
    if(!r||!r.ok){setStatus('erro ao salvar','error');return false;}
    var n=Object.keys(db).length; setStatus(n+' paciente'+(n!==1?'s':'')+' no Drive','connected'); return true;
  }catch(e){setStatus('erro ao salvar','error');return false;}
}

function onSearchInput(){
  var val=document.getElementById('searchInput').value.trim().toLowerCase();
  var list=document.getElementById('searchSuggestions');
  list.innerHTML='';
  if(!val){list.style.display='none';return;}
  var db=activeDB();
  var matches=Object.keys(db).filter(function(k){return k.toLowerCase().indexOf(val)>=0;}).slice(0,8);
  if(!matches.length){list.style.display='none';return;}
  matches.forEach(function(k){
    var li=document.createElement('li'); li.textContent=k;
    li.onclick=function(){document.getElementById('searchInput').value=k;list.style.display='none';searchPatient();};
    list.appendChild(li);
  });
  list.style.display='block';
}

async function searchPatient(){
  var val=document.getElementById('searchInput').value.trim();
  document.getElementById('searchSuggestions').style.display='none';
  if(!val){alert('Digite o nome ou ID.');return;}
  var db=activeDB(), rec=db[val];
  if(!rec){if(confirm('"'+val+'" nao encontrado. Criar novo?')){_curKey=val;newPatientSilent();document.getElementById('lbl').value=val;}return;}
  _curKey=val;
  points=rec.points.map(function(p){return Object.assign({},p);});
  patients={}; patOrder=[];
  points.forEach(function(p){getColor(p.label);});
  if(rec.dob)document.getElementById('dob').value=rec.dob;
  document.getElementById('lbl').value=val;
  document.getElementById('searchInput').value=val;
  clearTarget();
  rebuildDs(); renderTable();
  _unsaved=false; document.getElementById('unsavedBadge').style.display='none';
  await loadTarget519(val);
}

async function savePatient(){
  var lbl=document.getElementById('lbl').value.trim(), key=lbl||_curKey;
  if(!key){alert('Preencha o nome/ID.');return;}
  if(!points.length){alert('Nenhum ponto marcado.');return;}
  if(!_token){alert('Drive nao conectado. Clique no botao Drive primeiro.');return;}
  _curKey=key; document.getElementById('searchInput').value=key;
  var rec={dob:document.getElementById('dob').value, points:points.map(function(p){return Object.assign({},p);})};
  _db[key]=rec; saveDB(_db);
  var ok=await driveSave(_db); if(ok)flashSaved(); else alert('Erro ao salvar.');
}
function deletePatient(){
  var key=_curKey||document.getElementById('searchInput').value.trim();
  if(!key){alert('Nenhum paciente carregado.');return;}
  if(!confirm('Apagar "'+key+'"?'))return;
  if(_token){delete _db[key];saveDB(_db);driveSave(_db);}
  else{var db=loadDB();delete db[key];saveDB(db);}
  newPatient();
}
function newPatient(){
  if(_unsaved&&points.length>0&&!confirm('Dados nao salvos. Descartar?'))return;
  newPatientSilent();
}
function newPatientSilent(){
  points=[]; patients={}; patOrder=[]; _curKey=null; _unsaved=false;
  chart.data.datasets.splice(5); chart.update(); renderTable();
  ['dob','lbl','ht','searchInput','fatherHt','motherHt','targetHt'].forEach(function(id){

function exportData(){
  var db=_token?_db:loadDB();
  if(!Object.keys(db).length){alert('Nenhum dado para exportar.');return;}
  var blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob); var a=document.createElement('a');
  a.href=url; a.download='curva_0_5_backup.json'; a.click(); URL.revokeObjectURL(url);
}
function importData(event){
  var file=event.target.files[0]; if(!file)return;
  var reader=new FileReader();
  reader.onload=async function(e){
    try{
      var imp=JSON.parse(e.target.result); var count=0;
      if(_token){Object.entries(imp).forEach(function(kv){_db[kv[0]]=kv[1];count++;});saveDB(_db);await driveSave(_db);}
      else{var db=loadDB();Object.entries(imp).forEach(function(kv){db[kv[0]]=kv[1];count++;});saveDB(db);}
      alert(count+' paciente(s) importado(s)!');
    }catch(err){alert('Erro ao importar.');}
    event.target.value='';
  };
  reader.readAsText(file);
}
