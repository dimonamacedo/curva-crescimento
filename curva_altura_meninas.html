    padding: 5px 8px;
    font-size: 13px;

  .form-panel button {
    background: #d63384;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 7px 16px;
    font-size: 13px;
    cursor: pointer;
    font-weight: bold;

  .btn-clear {
    background: #666 !important;
  }
  .btn-clear:hover { background: #444 !important; }
  #error-msg {
    font-size: 12px;
    color: #c0392b;
    min-height: 16px;

    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 2px;
  }
  .chart-title {
    font-size: 22px;
    color: #c060c0;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .chart-subtitle {
    font-size: 13px;
    color: #333;
    margin-top: 2px;
  }
  .who-logo {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .who-logo-circle {
    width: 44px;
    height: 44px;
  }
  .who-logo-text {
    text-align: right;
    font-size: 11px;
    line-height: 1.3;
    color: #333;
  }

  .chart-wrapper {
    position: relative;
    width: 100%;
  }

  canvas#whoChart {
    display: block;
    width: 100% !important;
  }

  /* ── LISTA DE PONTOS ── */
  .points-list {
    margin-top: 8px;
    font-size: 11px;
  }
  .points-list table {
    width: 100%;
    border-collapse: collapse;
  }
  .points-list th {
    background: #e0a0e0;
    padding: 3px 8px;
    text-align: left;
    font-size: 11px;
    border: 1px solid #ccc;
  }
  .points-list td {
    padding: 3px 8px;
    border: 1px solid #ddd;
    font-size: 11px;
  }
  .dot-preview {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    vertical-align: middle;
    margin-right: 4px;
    border: 1.5px solid white;
    outline: 1px solid rgba(0,0,0,0.3);

  .btn-del {
    background: none;
    border: none;
    cursor: pointer;
    color: #999;
    font-size: 14px;
    padding: 0 2px;
  }
  .btn-del:hover { color: #c0392b; }

  .footer-ref {
    font-size: 10px;
    color: #666;
    text-align: right;
    margin-top: 4px;
  }

  @media print {
    body { background: white; padding: 0; }
    .page { box-shadow: none; width: 100%; padding: 8mm; }

    .btn-del { display: none; }

  m1: '#e08000',   // laranja
  m2: '#cc2200',   // vermelho
  m3: '#1a1a1a',   // preto
};

const POINT_COLORS = [
  '#1565C0','#6A1B9A','#00695C','#E65100',
  '#AD1457','#2E7D32','#4527A0','#00838F'
];

let colorIdx = 0;
let points = [];

// Plugin customizado para labels Z no lado direito
const zLabelPlugin = {
  id: 'zLabels',
  afterDraw(chart) {
    const ctx = chart.ctx;
    const xAxis = chart.scales.x;
    const yAxis = chart.scales.y;

    // Pega a posição X do último mês (228)
    const xPos = xAxis.getPixelForValue(228) + 6;

    const labels = [
      { key: 'p3', text: '3',  color: '#1a1a1a' },
      { key: 'p2', text: '2',  color: '#cc2200' },
      { key: 'p1', text: '1',  color: '#e08000' },
      { key: 'z0', text: '0',  color: '#2e8b00' },
      { key: 'm1', text: '-1', color: '#e08000' },
      { key: 'm2', text: '-2', color: '#cc2200' },
      { key: 'm3', text: '-3', color: '#1a1a1a' },
    ];

    labels.forEach(l => {
      const lastVal = Z[l.key][Z[l.key].length - 1].y;
      const yPos = yAxis.getPixelForValue(lastVal);
      ctx.save();
      ctx.font = 'bold 11px Arial';
      ctx.fillStyle = l.color;
      ctx.textBaseline = 'middle';
      ctx.fillText(l.text, xPos, yPos);
      ctx.restore();
    });
  }
};

// Desenhar fundo do gráfico como o OMS (borda magenta espessa)
const bgPlugin = {
  id: 'bgPlugin',
  beforeDraw(chart) {
    const ctx = chart.ctx;
    const {left, top, right, bottom, width, height} = chart.chartArea;
    // fundo branco da área
    ctx.save();
    ctx.fillStyle = 'white';
    ctx.fillRect(left, top, width, height);
    ctx.restore();
  }
};

// Meses que marcam cada ano (3, 6, 9 dentro de cada ano)

  return null;
}

const cfg = {
  type: 'scatter',
  data: {
    datasets: [
      mkLine('p3', 'Z +3', LINE_COLORS.p3, 2),
      mkLine('p2', 'Z +2', LINE_COLORS.p2, 1.8),
      mkLine('p1', 'Z +1', LINE_COLORS.p1, 1.8),
      mkLine('z0', 'Z  0', LINE_COLORS.z0, 2.2),
      mkLine('m1', 'Z -1', LINE_COLORS.m1, 1.8),
      mkLine('m2', 'Z -2', LINE_COLORS.m2, 1.8),
      mkLine('m3', 'Z -3', LINE_COLORS.m3, 2),
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    layout: { padding: { right: 28, top: 4, bottom: 2, left: 2 } },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label(ctx) {
            if (ctx.dataset._pt) {
              const n = ctx.dataset._name || '';
              const mo = ctx.parsed.x;
              const yr = Math.floor(mo/12);
              const m  = mo % 12;
              return `${n}: ${ctx.parsed.y} cm (${yr}a ${m}m)`;
            }
            return `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} cm`;
          }
        }
      }
    },
    scales: {
      x: {
        type: 'linear',
        min: 61,
        max: 228,
        border: { color: '#555' },
        grid: {
          color: (ctx) => {
            const v = ctx.tick.value;
            // linha mais forte a cada ano (múltiplo de 12 a partir de 60)
            if ((v - 60) % 12 === 0) return 'rgba(0,0,0,0.25)';
            return 'rgba(0,0,0,0.10)';
          },
          lineWidth: (ctx) => {
            const v = ctx.tick.value;
            if ((v - 60) % 12 === 0) return 1.2;
            return 0.7;
          },
          drawTicks: false,
        },
        ticks: {
          font: { size: 10, family: 'Arial' },
          color: '#333',
          maxRotation: 0,
          // Mostrar: "3 6 9" para meses, e o número do ano embaixo
          callback(val) {
            const offset = val - 60; // meses desde 5 anos
            if (offset % 12 === 3) return '3';
            if (offset % 12 === 6) return '6';
            if (offset % 12 === 9) return '9';
            if (offset % 12 === 0 && val > 60) return '';
            return '';
          },
          stepSize: 3,
          autoSkip: false,
        },
        afterTickToLabelConversion(axis) {
          // Adiciona labels de anos manualmente
        },
        title: {
          display: true,
          text: 'Age (completed months and years)',
          font: { size: 12, family: 'Arial' },
          color: '#222',
          padding: { top: 22 }
        }
      },
      y: {
        min: 88,
        max: 192,
        border: { color: '#555' },
        grid: {
          color: (ctx) => {
            if (ctx.tick.value % 10 === 0) return 'rgba(0,0,0,0.25)';
            return 'rgba(0,0,0,0.10)';
          },
          lineWidth: (ctx) => ctx.tick.value % 10 === 0 ? 1.2 : 0.7,
          drawTicks: false,
        },
        ticks: {
          font: { size: 10, family: 'Arial' },
          color: '#333',
          stepSize: 2,
          callback(v) { return Number.isInteger(v) && v % 10 === 0 ? v : ''; }
        },
        title: {
          display: true,
          text: 'Height (cm)',
          font: { size: 12, family: 'Arial' },
          color: '#222',
        }
      }
    }
  },
  plugins: [zLabelPlugin, bgPlugin,
    // Plugin para labels de ano no eixo X (segunda linha)
    {
      id: 'yearLabels',
      afterDraw(chart) {
        const ctx = chart.ctx;
        const xAxis = chart.scales.x;
        const yAxis = chart.scales.y;
        const bottom = yAxis.bottom;

        ctx.save();
        ctx.font = '11px Arial';
        ctx.fillStyle = '#222';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        // "Months" e "Years" labels à esquerda
        const leftX = xAxis.left - 2;
        ctx.textAlign = 'right';
        ctx.font = 'bold 9px Arial';
        ctx.fillText('Months', leftX, bottom + 4);
        ctx.fillText('Years', leftX, bottom + 16);

        // Anos: 5 a 19
        ctx.font = '11px Arial';
        ctx.textAlign = 'center';
        for (let yr = 5; yr <= 19; yr++) {
          const mo = yr * 12;
          if (mo < 61 || mo > 228) continue;
          const xPos = xAxis.getPixelForValue(mo);
          ctx.fillText(String(yr), xPos, bottom + 16);
        }

        // "90" no canto inferior esquerdo (valor do eixo Y mínimo)
        ctx.textAlign = 'right';
        ctx.font = '10px Arial';
        const y90 = yAxis.getPixelForValue(90);
        ctx.fillText('90', xAxis.left - 4, y90 - 5);

        ctx.restore();
      }
    },
    // Borda magenta ao redor da área do gráfico
    {
      id: 'pinkBorder',
      beforeDraw(chart) {
        const ctx = chart.ctx;
        const {left, top, right, bottom, width, height} = chart.chartArea;
        const pad = 12;
        ctx.save();
        ctx.fillStyle = '#d93bb5';
        // top bar
        ctx.fillRect(left - pad, top - pad, width + pad*2, pad);
        // bottom bar
        ctx.fillRect(left - pad, bottom, width + pad*2, pad);
        // left bar
        ctx.fillRect(left - pad, top - pad, pad, height + pad*2);
        // right bar
        ctx.fillRect(right, top - pad, pad + 28, height + pad*2);
        ctx.restore();
      }
    }
  ]
};

function mkLine(key, label, color, lw) {
  return {
    label,
    data: Z[key],
    borderColor: color,
    borderWidth: lw,
    pointRadius: 0,
    showLine: true,
    tension: 0.4,
    fill: false,
    _key: key,
  };
}

// Cria o gráfico
const canvas = document.getElementById('whoChart');
canvas.height = 420;
const chart = new Chart(canvas, cfg);

// ── LÓGICA DE PONTOS ──

function calcAgeMonths(dobStr) {
  const now = new Date();
  const b   = new Date(dobStr);
  let m = (now.getFullYear() - b.getFullYear()) * 12 + (now.getMonth() - b.getMonth());
  if (now.getDate() < b.getDate()) m--;
  return m;
}

function interpolate(key, ageM) {
  const idx = RAW.findIndex(r => r[0] === ageM);
  if (idx !== -1) {
    const col = {p3:1,p2:2,p1:3,z0:4,m1:5,m2:6,m3:7}[key];
    return RAW[idx][col];
  }
  // interpolação linear
  const lo = RAW.filter(r => r[0] < ageM).pop();
  const hi = RAW.find(r => r[0] > ageM);
  if (!lo || !hi) return null;
  const col = {p3:1,p2:2,p1:3,z0:4,m1:5,m2:6,m3:7}[key];
  const frac = (ageM - lo[0]) / (hi[0] - lo[0]);
  return lo[col] + frac * (hi[col] - lo[col]);
}

function calcZ(ageM, ht) {
  const z0  = interpolate('z0', ageM);
  const zp1 = interpolate('p1', ageM);
  const zm1 = interpolate('m1', ageM);
  const zp2 = interpolate('p2', ageM);
  const zm2 = interpolate('m2', ageM);
  if (z0 === null) return null;
  if (ht >= z0) {
    const sd = zp1 - z0; if (sd <= 0) return null;
    return ((ht - z0) / sd).toFixed(2);
  } else {
    const sd = z0 - zm1; if (sd <= 0) return null;
    return (-(z0 - ht) / sd).toFixed(2);
  }
}

function addPoint() {
  const dobV = document.getElementById('dob').value;
  const htV  = parseFloat(document.getElementById('ht').value);
  const lblV = document.getElementById('lbl').value.trim() || ('P' + (points.length + 1));
  const err  = document.getElementById('error-msg');
  err.textContent = '';

  if (!dobV) { err.textContent = 'Informe a data de nascimento.'; return; }
  if (isNaN(htV) || htV < 60 || htV > 200) { err.textContent = 'Altura inválida (60–200 cm).'; return; }

  const ageM = calcAgeMonths(dobV);
  if (ageM < 60 || ageM > 228) {
    err.textContent = `Idade fora do intervalo 5–19 anos (calculada: ${(ageM/12).toFixed(1)} anos).`;
    return;
  }

  const color = POINT_COLORS[colorIdx % POINT_COLORS.length];
  colorIdx++;
  const zScore = calcZ(ageM, htV);
  const pt = { id: Date.now(), label: lblV, dob: dobV, ageM, ht: htV, color, z: zScore };
  points.push(pt);

  // Adiciona dataset ao gráfico
  chart.data.datasets.push({
    label: lblV,
    _pt: true,
    _name: lblV,
    data: [{x: ageM, y: htV}],
    pointBackgroundColor: color,
    pointBorderColor: 'white',
    pointBorderWidth: 2,
    pointRadius: 7,
    pointHoverRadius: 9,
    pointStyle: 'circle',
    showLine: false,
    type: 'scatter',
  });
  chart.update();
  renderTable();

  // Limpa campos
  document.getElementById('ht').value = '';
  document.getElementById('lbl').value = '';
}

function removePoint(id) {
  const idx = points.findIndex(p => p.id === id);
  if (idx === -1) return;
  points.splice(idx, 1);
  chart.data.datasets.splice(7 + idx, 1);
  chart.update();
  renderTable();
}

function clearAll() {
  points = [];
  colorIdx = 0;
  chart.data.datasets.splice(7);
  chart.update();
  renderTable();
}

function formatDob(dobStr) {
  const [y,m,d] = dobStr.split('-');
  return `${d}/${m}/${y}`;
}

function renderTable() {
  const sec   = document.getElementById('ptsList');
  const tbody = document.getElementById('ptsTbody');
  tbody.innerHTML = '';
  if (points.length === 0) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  points.forEach(p => {
    const yr = Math.floor(p.ageM / 12);
    const mo = p.ageM % 12;
    const zStr = p.z !== null ? p.z : '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="dot-preview" style="background:${p.color}"></span>${p.label}</td>
      <td>${p.label}</td>
      <td>${formatDob(p.dob)}</td>
      <td>${yr} anos e ${mo} meses</td>
      <td>${p.ht.toFixed(1)} cm</td>
      <td>${zStr}</td>
      <td class="no-print"><button class="btn-del" onclick="removePoint(${p.id})" title="Remover">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
}
